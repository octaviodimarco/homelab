apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: goldilocks
  namespace: goldilocks
spec:
  interval: 30m
  chart:
    spec:
      chart: goldilocks
      version: "11.1.0"
      sourceRef:
        kind: HelmRepository
        name: fairwinds-stable
        namespace: goldilocks
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace

  values:
    vpa:
      enabled: true
      updater:
        enabled: false
      recommender:
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
      admissionController:
        resources:
          requests:
            cpu: 15m
            memory: 64Mi

    metrics-server:
      enabled: false

    controller:
      flags:
        on-by-default: false
      resources:
        requests:
          cpu: 15m
          memory: 64Mi

    dashboard:
      replicaCount: 1
      flags:
        on-by-default: false
      resources:
        requests:
          cpu: 15m
          memory: 64Mi
