apiVersion: v1
kind: ConfigMap
metadata:
  name: external-dns-values
data:
  values.yaml: |
    provider: cloudflare
    policy: sync
    logLevel: info
    domainFilters:
      - "dimarco-server.site"
      - "tarbi.app"
    extraArgs:
      - --annotation-filter=external-dns.kubernetes.io/managed=true
      - --annotation-prefix=external-dns.alpha.kubernetes.io/
    txtOwnerId: "k8s-gordito-cluster"
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token-secret
            key: CLOUDFLARE_API_TOKEN
